name: Build PK55 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Game App
        run: |
          flutter create --org com.pk55.game --project-name pk55 pk55_app
          cd pk55_app
          cat << 'EOF' > lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';

          void main() => runApp(const PK55App());

          class PK55App extends StatelessWidget {
            const PK55App({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PK55 Casino',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const MainLobby(),
              );
            }
          }

          class MainLobby extends StatefulWidget {
            const MainLobby({super.key});

            @override
            State<MainLobby> createState() => _MainLobbyState();
          }

          class _MainLobbyState extends State<MainLobby> {
            int coins = 10000;

            final List<String> games = [
              'Teen Patti', 'Dragon Tiger', 'Lucky Spin', '7 Up Down',
              'Crash Aviator', 'Fruit Classic', 'Roulette', 'Poker King',
              'Andar Bahar', 'Mega Slots', 'Mines Gold', 'Ludo Gold',
              'Baccarat', 'Blackjack', 'Jhandi Munda', 'Fortune Tiger',
              'Zoo Roulette', 'Car Roulette', 'Fish Hunter', 'Golden Wheel',
              'Dice Duel', 'Super Keno', 'Rummy Plus', 'Golden Horse'
            ];

            void openGame(String name) async {
              final res = await Navigator.push<int>(
                context,
                MaterialPageRoute(builder: (c) => PlayScreen(name: name, coins: coins)),
              );
              if (res != null) setState(() => coins = res);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF070B19),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0F172A),
                  title: const Text('PK55 CASINO', style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                  centerTitle: true,
                  actions: [
                    Center(
                      child: Container(
                        margin: const EdgeInsets.only(right: 12),
                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                        decoration: BoxDecoration(color: Colors.amber, borderRadius: BorderRadius.circular(15)),
                        child: Text('🪙 $coins', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                      ),
                    )
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      margin: const EdgeInsets.all(12),
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(10)),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          const Text('VIP DAILY BONUS', style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black),
                            onPressed: () => setState(() => coins += 2000),
                            child: const Text('GET +2000'),
                          )
                        ],
                      ),
                    ),
                    Expanded(
                      child: GridView.builder(
                        padding: const EdgeInsets.symmetric(horizontal: 12),
                        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 2,
                          crossAxisSpacing: 8,
                          mainAxisSpacing: 8,
                          childAspectRatio: 1.2,
                        ),
                        itemCount: games.length,
                        itemBuilder: (c, i) {
                          return Card(
                            color: const Color(0xFF131B2E),
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                            child: InkWell(
                              onTap: () => openGame(games[i]),
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  const Icon(Icons.casino, color: Colors.amber, size: 30),
                                  const SizedBox(height: 6),
                                  Text(games[i], textAlign: TextAlign.center, style: const TextStyle(fontWeight: FontWeight.bold)),
                                  const SizedBox(height: 4),
                                  const Text('PLAY', style: TextStyle(color: Colors.greenAccent, fontSize: 11)),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class PlayScreen extends StatefulWidget {
            final String name;
            final int coins;
            const PlayScreen({super.key, required this.name, required this.coins});

            @override
            State<PlayScreen> createState() => _PlayScreenState();
          }

          class _PlayScreenState extends State<PlayScreen> {
            late int currentCoins;
            int bet = 100;
            String msg = "Bet lagao te Play dabao!";
            String symbol = "🎰";

            @override
            void initState() {
              super.initState();
              currentCoins = widget.coins;
            }

            void play() {
              if (currentCoins < bet) {
                setState(() => msg = "Sikke muk gaye!");
                return;
              }
              setState(() {
                currentCoins -= bet;
                final win = Random().nextBool();
                final list = ['💎', '👑', '7️⃣', '🎲', '⚡'];
                symbol = list[Random().nextInt(list.length)];
                if (win) {
                  currentCoins += bet * 2;
                  msg = "🎉 Jitt gaye! +${bet * 2}";
                } else {
                  msg = "😢 Haar gaye! Try karo.";
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  Navigator.pop(context, currentCoins);
                  return false;
                },
                child: Scaffold(
                  appBar: AppBar(
                    title: Text(widget.name),
                    leading: IconButton(
                      icon: const Icon(Icons.arrow_back),
                      onPressed: () => Navigator.pop(context, currentCoins),
                    ),
                    actions: [
                      Center(
                        child: Padding(
                          padding: const EdgeInsets.only(right: 16),
                          child: Text('🪙 $currentCoins', style: const TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                        ),
                      )
                    ],
                  ),
                  body: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Text(symbol, style: const TextStyle(fontSize: 60)),
                        const SizedBox(height: 20),
                        Text(msg, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 25),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [100, 500, 1000].map((b) => Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 4),
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(backgroundColor: bet == b ? Colors.amber : Colors.grey[800], foregroundColor: bet == b ? Colors.black : Colors.white),
                              onPressed: () => setState(() => bet = b),
                              child: Text('$b'),
                            ),
                          )).toList(),
                        ),
                        const SizedBox(height: 20),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.green, padding: const EdgeInsets.symmetric(horizontal: 40, vertical: 12)),
                          onPressed: play,
                          child: Text('PLAY ($bet)'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PK55-Game-Release-APK
          path: pk55_app/build/app/outputs/flutter-apk/app-release.apk
          

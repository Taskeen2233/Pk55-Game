

name: Build PK55 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create PK55 App
        run: |
          flutter create --org com.pk55.game --project-name pk55 pk55_app
          cd pk55_app
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const PK55GameApp());
          }

          class PK55GameApp extends StatelessWidget {
            const PK55GameApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PK55 Game',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const PK55LobbyPage(),
              );
            }
          }

          class PK55LobbyPage extends StatefulWidget {
            const PK55LobbyPage({super.key});

            @override
            State<PK55LobbyPage> createState() => _PK55LobbyPageState();
          }

          class _PK55LobbyPageState extends State<PK55LobbyPage> {
            int coins = 10000;

            final List<Map<String, dynamic>> games = [
              {'name': 'Teen Patti', 'icon': Icons.style, 'color': Colors.redAccent},
              {'name': 'Dragon Tiger', 'icon': Icons.flash_on, 'color': Colors.orangeAccent},
              {'name': 'Roulette', 'icon': Icons.pie_chart, 'color': Colors.purpleAccent},
              {'name': 'Lucky Spin', 'icon': Icons.casino, 'color': Colors.amber},
              {'name': '7 Up Down', 'icon': Icons.trending_up, 'color': Colors.blueAccent},
              {'name': 'Ludo Gold', 'icon': Icons.games, 'color': Colors.greenAccent},
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0E1A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF131B2E),
                  title: const Text(
                    'PK55 VIP LOBBY',
                    style: TextStyle(fontWeight: FontWeight.bold, color: Colors.amber, letterSpacing: 1.5),
                  ),
                  centerTitle: true,
                  actions: [
                    Container(
                      margin: const EdgeInsets.only(right: 12, top: 10, bottom: 10),
                      padding: const EdgeInsets.symmetric(horizontal: 12),
                      decoration: BoxDecoration(
                        color: Colors.black45,
                        borderRadius: BorderRadius.circular(20),
                        border: Border.all(color: Colors.amber, width: 1.5),
                      ),
                      child: Row(
                        children: [
                          const Icon(Icons.monetization_on, color: Colors.amber, size: 18),
                          const SizedBox(width: 6),
                          Text(
                            '$coins',
                            style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 14),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      margin: const EdgeInsets.all(14),
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [Color(0xFF1E293B), Color(0xFF334155)],
                          begin: Alignment.topLeft,
                          end: Alignment.bottomRight,
                        ),
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(color: Colors.amber, width: 1.5),
                        boxShadow: const [
                          BoxShadow(color: Colors.black54, blurRadius: 8, offset: Offset(0, 4)),
                        ],
                      ),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: const [
                              Text('VIP WELCOME BONUS', style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold, fontSize: 15)),
                              SizedBox(height: 4),
                              Text('Instant Withdrawal 24/7', style: TextStyle(color: Colors.white70, fontSize: 12)),
                            ],
                          ),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: Colors.amber,
                              foregroundColor: Colors.black,
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                            ),
                            onPressed: () {
                              setState(() {
                                coins += 1000;
                              });
                              ScaffoldMessenger.of(context).showSnackBar(
                                const SnackBar(content: Text('+1,000 Coins Added to Wallet!')),
                              );
                            },
                            child: const Text('CLAIM', style: TextStyle(fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: GridView.builder(
                        padding: const EdgeInsets.symmetric(horizontal: 14),
                        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 2,
                          crossAxisSpacing: 12,
                          mainAxisSpacing: 12,
                          childAspectRatio: 1.1,
                        ),
                        itemCount: games.length,
                        itemBuilder: (context, index) {
                          final game = games[index];
                          return Card(
                            color: const Color(0xFF161F36),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(16),
                              side: BorderSide(color: (game['color'] as Color).withOpacity(0.6), width: 1.5),
                            ),
                            elevation: 5,
                            child: InkWell(
                              borderRadius: BorderRadius.circular(16),
                              onTap: () {
                                ScaffoldMessenger.of(context).showSnackBar(
                                  SnackBar(content: Text('Opening ${game['name']} Table...')),
                                );
                              },
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  CircleAvatar(
                                    radius: 28,
                                    backgroundColor: (game['color'] as Color).withOpacity(0.2),
                                    child: Icon(game['icon'] as IconData, size: 32, color: game['color'] as Color),
                                  ),
                                  const SizedBox(height: 10),
                                  Text(
                                    game['name'] as String,
                                    style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.white),
                                  ),
                                  const SizedBox(height: 4),
                                  const Text('PLAY NOW', style: TextStyle(color: Colors.greenAccent, fontSize: 11, fontWeight: FontWeight.bold)),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF
          flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PK55-Game-Release-APK
          path: pk55_app/build/app/outputs/flutter-apk/app-release.apk
          

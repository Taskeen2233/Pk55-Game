name: Build PK55 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create PK55 App
        run: |
          flutter create --org com.pk55.game --project-name pk55 pk55_app
          cd pk55_app
          flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PK55-Game-Release-APK
          path: pk55_app/build/app/outputs/flutter-apk/app-release.apk
          

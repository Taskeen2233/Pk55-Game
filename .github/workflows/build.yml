
name: Build PK55 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create PK55 App
        run: |
          flutter create --org com.pk55.game --project-name pk55 pk55_app
          cd pk55_app
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const PK55GameApp());
          }

          class PK55GameApp extends StatelessWidget {
            const PK55GameApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PK 55',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const GameLobbyPage(),
              );
            }
          }

          class GameLobbyPage extends StatelessWidget {
            const GameLobbyPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  title: const Text('PK 55 - Official Platform', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.amber)),
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: const Color(0xFF1E293B),
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(color: Colors.amber, width: 2),
                        ),
                        child: Column(
                          children: const [
                            Icon(Icons.casino, size: 80, color: Colors.amber),
                            SizedBox(height: 10),
                            Text('PK 55', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Colors.white)),
                            SizedBox(height: 6),
                            Text('Welcome Bonus: 1,000 Coins Added!', style: TextStyle(color: Colors.greenAccent, fontSize: 16)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 30),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.green,
                          padding: const EdgeInsets.symmetric(horizontal: 40, vertical: 15),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(30)),
                        ),
                        onPressed: () {},
                        child: const Text('PLAY NOW', style: TextStyle(fontSize: 18, color: Colors.white, fontWeight: FontWeight.bold)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF
          flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PK55-Game-Release-APK
          path: pk55_app/build/app/outputs/flutter-apk/app-release.apk
          
